name: Student Placement CI-CD

on:
  push:
    branches: [ "main" ]

jobs:

  test:

    runs-on: ubuntu-latest

    steps:

    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install Libraries
      run: |
        pip install -r requirements.txt

    - name: Train Model
      run: |
        python train.py

    - name: Run Tests
      run: |
        pytest

  deploy:

    needs: test

    runs-on: ubuntu-latest

    steps:

    - name: Deploy
      run: |
        echo "Student Placement Model Deployed Successfully!"